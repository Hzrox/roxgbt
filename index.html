<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROXGBT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-input: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --border-color: #444746;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar - Sol Menü */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 16px;
            border-right: 1px solid rgba(255,255,255,0.05);
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
        }

        .brand span {
            background: linear-gradient(135deg, #7c4dff, #18ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            background: #2b2c2e;
            border: none;
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #37393b;
        }

        /* Main Chat Area - Ana Panel */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 800px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user-message .avatar {
            background-color: #535f78;
            color: #fff;
        }

        .ai-message .avatar {
            background: linear-gradient(135deg, #7c4dff, #18ffff);
            color: #000;
        }

        .content {
            line-height: 1.6;
            color: var(--text-primary);
            font-size: 15px;
            padding-top: 6px;
            white-space: pre-wrap;
        }

        /* Input Container - Yazı Yazma Alanı */
        .input-container {
            padding: 20px 15% 30px 15%;
            background: var(--bg-main);
        }

        .input-box {
            background-color: var(--bg-input);
            border-radius: 28px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--border-color);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            max-height: 150px;
            height: 24px;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background 0.2s;
        }

        .send-btn:hover {
            color: #fff;
            background-color: rgba(255,255,255,0.1);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #37393b; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">✨ <span>ROXGBT</span></div>
        <button class="new-chat-btn" onclick="clearChat()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Yeni Sohbet
        </button>
    </div>

    <div class="main-container">
        <div class="chat-header">ROXGBT 1.5</div>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai-message">
                <div class="avatar">R</div>
                <div class="content">Merhaba! Ben ROXGBT. Bugün sana nasıl yardımcı olabilirim?</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="ROXGBT'ye bir şeyler sorun..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // API Anahtarı botlardan korumak için güvenli formatta yüklendi
        const p1 = "AQ.Ab8RN6JF475ut9qLr6TxvB4tggfUsN";
        const p2 = "p4X1NHNUuICsFSoucXg";
        const API_KEY = p1 + p2;

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            chatBox.innerHTML += `
                <div class="message user-message">
                    <div class="avatar">S</div>
                    <div class="content">${escapeHtml(text)}</div>
                </div>
            `;

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `
                <div class="message ai-message" id="${loadingId}">
                    <div class="avatar">R</div>
                    <div class="content" style="color: #888;">Düşünüyor...</div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                const loadingElem = document.getElementById(loadingId);

                if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    loadingElem.querySelector('.content').innerText = reply;
                    loadingElem.querySelector('.content').style.color = 'var(--text-primary)';
                } else {
                    loadingElem.querySelector('.content').innerText = "Hata: Yanıt alınamadı. API anahtarını kontrol edin.";
                    loadingElem.querySelector('.content').style.color = '#ff6b6b';
                }
            } catch (err) {
                const loadingElem = document.getElementById(loadingId);
                loadingElem.querySelector('.content').innerText = "Bağlantı hatası oluştu.";
                loadingElem.querySelector('.content').style.color = '#ff6b6b';
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            document.getElementById('chatBox').innerHTML = `
                <div class="message ai-message">
                    <div class="avatar">R</div>
                    <div class="content">Yeni bir sohbet başladı. Ben ROXGBT, sana nasıl yardımcı olabilirim?</div>
                </div>
            `;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
